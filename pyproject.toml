[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent-platform"
version = "0.1.0"
description = "Privacy-first, human-reviewed career intelligence MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Career Agent Platform contributors" }]
dependencies = []

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1,<2"]

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
