[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent-platform"
version = "0.5.0"
description = "Privacy-first, human-reviewed career intelligence MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Career Agent Platform contributors" }]
dependencies = []

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1,<2"]
graph = ["langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3,<4"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3,<4", "python-docx>=1.1,<2"]
dev = ["httpx>=0.27,<1"]
pdf = ["playwright>=1.50,<2"]
pdf-test = ["pypdf>=5,<7"]
resume = ["pypdf>=5,<7"]
lca = ["openpyxl>=3.1,<4", "defusedxml>=0.7,<1"]
ai = ["anthropic>=0.40,<1", "openai>=2,<3", "boto3>=1.35,<2", "httpx>=0.27,<1"]

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_agent = ["web/*.html", "web/*.css", "web/*.js", "templates/*.css", "third_party/*.txt"]
