# Experimental database service for the PostgreSQL migration. The application
# still uses SQLite; starting this service does not migrate or connect its data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: career
      POSTGRES_DB: career
      POSTGRES_PASSWORD: ${CAREER_POSTGRES_PASSWORD:?Set CAREER_POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:${CAREER_POSTGRES_PORT:-54329}:5432"
    volumes:
      - career-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  career-postgres-data:
