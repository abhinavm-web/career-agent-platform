name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[graph,web,dev,pdf,pdf-test,ai,lca,backup]"
      - name: Install PDF browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        env:
          CAREER_AGENT_TEST_PDF: "1"
          CAREER_AGENT_TEST_BROWSER: "1"
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Check frontend JavaScript
        run: |
          node --check src/career_agent/web/app.js
          node --check src/career_agent/web/h1b.js
          node --check src/career_agent/web/ai.js
          node --check src/career_agent/web/automation.js
      - name: Test async dashboard UI state
        run: node --test tests/test_dashboard_js.cjs
